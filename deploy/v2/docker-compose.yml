services:
  api:
    build:
      context: ../..
      dockerfile: deploy/v2/Dockerfile.vps
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_REF: ${BUILD_REF:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: immo3d-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend.env
    expose:
      - "10000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=2)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
